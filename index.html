<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>區段複習台</title>
<style>
:root{--ink:#16231f;--muted:#66736d;--rule:#dfe5e1;--past:#0f5c52;--past2:#0b4a42;--soft:#e8f2ee;--bg:#f3f6f4;--card:#fff;--err:#c0392b}
@media(prefers-color-scheme:dark){:root{--ink:#e8efec;--muted:#9aa8a2;--rule:#2b3a35;--past:#3fb59f;--past2:#35a08c;--soft:#1d2b27;--bg:#0e1412;--card:#17201d;--err:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:20px}
.gate{width:100%;max-width:400px;background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:30px 26px 22px;box-shadow:0 10px 40px rgba(15,60,50,.08)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--past);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;margin-bottom:14px}
h1{margin:0 0 4px;font-size:23px;letter-spacing:.5px}
.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.fld{width:100%;height:48px;padding:0 14px;font-size:16px;border:1.5px solid var(--rule);border-radius:12px;background:transparent;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.fld:focus{border-color:var(--past);box-shadow:0 0 0 3px var(--soft)}
.sec{margin-bottom:16px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--past);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.acct .fld{margin-bottom:10px}
.hide{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--past);font-size:13px;cursor:pointer;text-decoration:none;font-weight:500}
.lnk:hover{text-decoration:underline}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:4px 0 16px}
.chk input{width:18px;height:18px;accent-color:var(--past)}
#go{width:100%;height:50px;border:0;border-radius:12px;background:var(--past);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
#go:hover{background:var(--past2)}#go:disabled{opacity:.6;cursor:default}
.bar{height:4px;border-radius:2px;background:var(--soft);margin-top:14px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--past);transition:width .15s}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--muted);text-align:center}.err{color:var(--err)}
.foot{text-align:center;margin-top:6px}
.note{font-size:12px;color:var(--muted);margin:16px 0 0;border-top:1px solid var(--rule);padding-top:12px;line-height:1.6}
</style></head><body>
<main class="gate">
<div class="logo">醫</div>
<h1>區段複習台</h1>
<p class="sub">輸入網站密碼解鎖。內容已加密，只會在你的瀏覽器裡解開。</p>
<form id="f" autocomplete="off">
<div class="sec" id="pwsec"><label class="lbl" for="pw">網站密碼</label>
<input class="fld" id="pw" type="password" autocomplete="off" placeholder="朋友給你的網站密碼" required></div>
<div class="acct">
<label class="lbl">我的帳號<span style="font-weight:400">（同步星星與答題紀錄，換裝置也在）</span></label>
<div class="seg" id="seg"><button type="button" data-m="login" class="on">登入</button><button type="button" data-m="register">註冊</button><button type="button" data-m="none">先不用</button></div>
<div id="acf">
<input class="fld" id="em" type="email" autocomplete="email" placeholder="信箱">
<input class="fld" id="apw" type="password" autocomplete="current-password" placeholder="帳號密碼（至少 6 個字）">
<div class="row"><span></span><button type="button" id="rs" class="lnk">忘記帳號密碼？</button></div>
</div></div>
<label class="chk"><input type="checkbox" id="rem" checked> 記住我的密碼與帳號（這台裝置下次自動進入、自動登入）</label>
<button id="go">解鎖</button>
</form>
<div class="bar" id="bar"><i id="bari"></i></div>
<div class="msg" id="msg"></div>
<div class="foot"><button class="lnk hide" id="forget" type="button">清除這台裝置的記住狀態</button></div>
<p class="note">本站僅供個人學習、複習參考。題目、圖片與講義內容的著作權屬原出題單位與授課老師；答案與詳解部分為整理或 AI 推論，請以官方公告與課堂內容為準。</p>
</main>
<script>
const ITER=600000, SALT=Uint8Array.from(atob("M4twtVuZ5T1bBFJb5NQRYg=="),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id), dec=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64e=u=>btoa(String.fromCharCode(...u));
const msg=(t,err)=>{$("msg").textContent=t;$("msg").className="msg"+(err?" err":"")};
async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function getBin(key,file){
  const r=await fetch(file,{cache:"no-cache"}); if(!r.ok) throw new Error("fetch "+file);
  const b=new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));
}
async function unlock(key){
  let man; try{ man=JSON.parse(dec.decode(await getBin(key,"m.bin"))); }catch(e){ throw new Error("BADPW"); }
  const ents=Object.entries(man.files), data={}, q=ents.slice(); let n=0; $("bar").style.display="block";
  await Promise.all(Array.from({length:6},async()=>{ while(q.length){ const [p,i]=q.shift(); data[p]=await getBin(key,i.f); ++n; msg("解密中… "+n+" / "+ents.length); $("bari").style.width=(100*n/ents.length)+"%"; } }));
  const imgUrl={}, imgs=[];
  for(const [p,i] of ents) if(i.t==="img"){ imgUrl[p]=URL.createObjectURL(new Blob([data[p]],{type:i.m})); imgs.push(p); }
  imgs.sort((a,b)=>b.length-a.length);
  const patch=t=>{ for(const p of imgs) t=t.split(p).join(imgUrl[p]); return t; };
  let html=dec.decode(data["index.html"]);
  html=html.replace(/<script src="([^"]+)"><\/script>/g,(m,s)=>{
    if(!data[s]) return m;
    return '<script src="'+URL.createObjectURL(new Blob([patch(dec.decode(data[s]))],{type:"text/javascript"}))+'"><\/script>';
  });
  html=patch(html);
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  const k=localStorage.getItem("ms_key"); if(!k) return false;
  $("forget").classList.remove("hide");
  /* 這台裝置已記住網站密碼，但還沒登入帳號、也沒選過「先不用」→ 停在這頁讓使用者選，不要一閃就進去 */
  if(!localStorage.getItem("medstudyAuth")&&localStorage.getItem("ms_mode")!=="none"){
    REM=k; $("pwsec").classList.add("hide"); $("pw").required=false; $("go").textContent="進入";
    msg("這台裝置已記住網站密碼。登入帳號就能同步；不想登入請選「先不用」再按進入。"); return false; }
  try{ msg("自動解鎖中…"); await unlock(await crypto.subtle.importKey("raw",b64d(k),"AES-GCM",false,["decrypt"])); return true; }
  catch(e){ localStorage.removeItem("ms_key"); $("forget").classList.add("hide"); msg("這台裝置記住的金鑰已失效，請重新輸入密碼",true); return false; }
}
$("forget").onclick=()=>{ localStorage.removeItem("ms_key"); $("forget").classList.add("hide"); msg("已清除"); };
/* 帳號（選用）：用 Firebase REST 登入／註冊，登入資料存在這個網站自己的 localStorage（medstudyAuth），解鎖後網站會自動接手同步 */
let REM=null; const FBK="AIzaSyAvhAKfpmy5h1Hnk8E9ej-nSvedoA-Ql-U"; let amode="login";
const ERR={EMAIL_EXISTS:"這個信箱已經註冊過了，請改用「登入」",INVALID_LOGIN_CREDENTIALS:"帳號信箱或帳號密碼不正確",INVALID_PASSWORD:"帳號信箱或帳號密碼不正確",
 EMAIL_NOT_FOUND:"找不到這個信箱，請先註冊",WEAK_PASSWORD:"帳號密碼太短，至少 6 個字元",INVALID_EMAIL:"信箱格式不正確",MISSING_PASSWORD:"請輸入帳號密碼",
 TOO_MANY_ATTEMPTS_TRY_LATER:"嘗試次數太多，請稍後再試"};
const fbmsg=m=>{ const k=Object.keys(ERR).find(c=>String(m).includes(c)); return k?ERR[k]:(/Failed to fetch|Network/i.test(m)?"連不上網路，帳號功能需要網路":"帳號錯誤："+m); };
async function fb(path,body){ const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:"+path+"?key="+FBK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status)); return j; }
const setMode=m=>{ amode=m; try{localStorage.setItem("ms_mode",m);}catch(e){}
  document.querySelectorAll("#seg button").forEach(b=>b.className=b.dataset.m===m?"on":"");
  $("acf").className=m==="none"?"hide":""; $("em").required=m!=="none"; $("apw").required=m!=="none";
  $("apw").autocomplete=m==="register"?"new-password":"current-password"; $("rs").className="lnk"+(m==="login"?"":" hide"); };
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
try{ $("em").value=localStorage.getItem("ms_email")||""; }catch(e){}
setMode(localStorage.getItem("medstudyAuth")?"none":(localStorage.getItem("ms_mode")||"login"));
$("rs").onclick=async()=>{ const em=$("em").value.trim(); if(!em){ msg("請先在上面填信箱",true); return; }
  try{ await fb("sendOobCode",{requestType:"PASSWORD_RESET",email:em}); msg("已寄出重設密碼的信到 "+em+"（沒看到請查垃圾信件匣）"); }catch(e){ msg(fbmsg(e.message),true); } };
async function accountLogin(){
  if(amode==="none") return;
  const em=$("em").value.trim(); if(!em) throw new Error("INVALID_EMAIL");
  const pw=$("apw").value; if(!pw) throw new Error("MISSING_PASSWORD");
  const r=await fb(amode==="register"?"signUp":"signInWithPassword",{email:em,password:pw,returnSecureToken:true});
  if($("rem").checked) localStorage.setItem("ms_email",em);
  localStorage.setItem("medstudyAuth",JSON.stringify({email:em,uid:r.localId,idToken:r.idToken,refreshToken:r.refreshToken,exp:Date.now()+(+r.expiresIn)*1000-60000}));
}
$("f").onsubmit=async e=>{
  e.preventDefault(); $("go").disabled=true; msg("驗證密碼中…（手機可能要幾秒）");
  try{
    const key=(!$("pw").value&&REM)?await crypto.subtle.importKey("raw",b64d(REM),"AES-GCM",true,["decrypt"]):await deriveKey($("pw").value);
    try{ await getBin(key,"m.bin"); }catch(x){ throw new Error("BADPW"); }
    try{ await accountLogin(); }catch(x){ $("go").disabled=false; msg(fbmsg(x.message),true); return; }
    if($("rem").checked){ localStorage.setItem("ms_key",b64e(new Uint8Array(await crypto.subtle.exportKey("raw",key)))); }
    await unlock(key);
  }catch(err){
    localStorage.removeItem("ms_key"); $("go").disabled=false;
    msg(err.message==="BADPW"?"密碼不對":"載入失敗："+err.message,true);
  }
};
if(!window.crypto||!crypto.subtle){ msg("這個瀏覽器不支援解密（需要 https 或較新的瀏覽器）",true); $("go").disabled=true; }
else tryRemembered();
</script></body></html>
